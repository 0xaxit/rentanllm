name: Node agent release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build and attach binaries to
        required: true

permissions:
  contents: read

concurrency:
  group: node-agent-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  BUN_VERSION: 1.3.10
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        include:
          # macOS binaries are built on macOS so they can be ad-hoc code signed.
          - { os: macos-latest, target: darwin-arm64 }
          - { os: macos-latest, target: darwin-x64 }
          - { os: ubuntu-latest, target: linux-x64 }
          - { os: ubuntu-latest, target: linux-arm64 }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Compile
        working-directory: apps/node-agent
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p ../../dist
          bun build src/main.ts --compile --minify \
            --target="bun-${TARGET}" \
            --outfile="../../dist/ral-${TAG}-${TARGET}"
      - name: Ad-hoc code sign
        if: runner.os == 'macOS'
        run: codesign --force --sign - "dist/ral-${TAG}-${{ matrix.target }}"
      - name: Smoke test
        if: matrix.target == 'linux-x64' || matrix.target == 'darwin-arm64'
        run: '"dist/ral-${TAG}-${{ matrix.target }}" --help'
      - uses: actions/upload-artifact@v7
        with:
          name: ral-${{ matrix.target }}
          path: dist/ral-*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: ral-*
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          chmod +x ral-*
          sha256sum ral-* | tee SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/ral-*
            dist/SHA256SUMS
