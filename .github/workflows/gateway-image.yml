name: Gateway image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - apps/gateway/**
      - packages/**
      - package.json
      - bun.lock
      - .github/workflows/gateway-image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gateway-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-push:
    name: Build and push to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          # metadata-action lowercases the owner, which GHCR requires.
          images: ghcr.io/${{ github.repository_owner }}/rentanllm-gateway
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=rentanllm-gateway
            org.opencontainers.image.description=RentAnLLM edge gateway

      # The Hostinger VPS is x86_64; add linux/arm64 (and docker/setup-qemu-action) if that changes.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/gateway/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,scope=gateway,mode=max
