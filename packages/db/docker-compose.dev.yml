# Local Postgres 17 and Redis for development only (`bun dev` starts them).
# Credentials are throwaway dev defaults.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rentanllm
      POSTGRES_USER: rentanllm
      POSTGRES_PASSWORD: rentanllm
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rentanllm -d rentanllm"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
